              &lt;div class=&quot;link-copy&quot;&gt;&lt;span class=&quot;link-title&quot;&gt;相反数联动&lt;/span&gt;&lt;span class=&quot;link-desc&quot;&gt;打开后，拖动 A 点，B 点自动变为 A 的相反数&lt;/span&gt;&lt;/div&gt;
              &lt;label class=&quot;switch&quot; aria-label=&quot;开启相反数联动&quot;&gt;&lt;input id=&quot;oppositeToggle&quot; type=&quot;checkbox&quot; /&gt;&lt;span class=&quot;switch-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/label&gt;

              &lt;div class=&quot;point-stat&quot;&gt;&lt;span class=&quot;label&quot;&gt;动点 B&lt;/span&gt;&lt;strong id=&quot;bValue&quot; class=&quot;b-value&quot;&gt;3&lt;/strong&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const svg = document.getElementById('numberLine');
      const minInput = document.getElementById('minInput');
      const maxInput = document.getElementById('maxInput');
      const stepInput = document.getElementById('stepInput');
      const applyBtn = document.getElementById('applyBtn');
      const resetBtn = document.getElementById('resetBtn');
      const rangeMessage = document.getElementById('rangeMessage');
      const rangeSummary = document.getElementById('rangeSummary');
      const aValue = document.getElementById('aValue');
      const bValue = document.getElementById('bValue');
      const compareResult = document.getElementById('compareResult');
      const oppositeToggle = document.getElementById('oppositeToggle');
      const errorTip = document.getElementById('errorTip');

      const defaults = { min: -5, max: 5, step: 1, a: -2, b: 3, oppositeLink: false };
      const state = { ...defaults, dragging: null, lastComparison: '' };
      const geom = { left: 72, right: 928, axisY: 198, topY: 67, bottomY: 292 };
      let typesetTokens = new WeakMap();
      let dragFrame = 0;
      let pendingDragKey = null;
      let pendingDragValue = null;

      window.__interactionState = { type: 'number-line', min: state.min, max: state.max, step: state.step, a: state.a, b: state.b, dragging: null, comparison: '' };

      const fmt = (value) =&gt; {
        const rounded = Math.round(value * 100) / 100;
        if (Object.is(rounded, -0)) return '0';
        return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/(\\.\\d*?)0+$/, '$1');
      };
      const signed = (value) =&gt; fmt(value).replace('-', '&minus;');
      const clamp = (v, lo, hi) =&gt; Math.min(hi, Math.max(lo, v));
      const isValidNumber = (v) =&gt; Number.isFinite(v);
      const snap = (v) =&gt; {
        const count = Math.round((v - state.min) / state.step);
        return clamp(state.min + count * state.step, state.min, state.max);
      };
      const xFor = (value) =&gt; geom.left + ((value - state.min) / (state.max - state.min)) * (geom.right - geom.left);
      const valueForX = (x) =&gt; snap(state.min + ((x - geom.left) / (geom.right - geom.left)) * (state.max - state.min));
      const syncOpposite = () =&gt; {
        if (!state.oppositeLink) return;
        state.b = snap(clamp(-state.a, state.min, state.max));
      };
      const esc = (text) =&gt; String(text).replace(/[&amp;&lt;&gt;&quot;']/g, (c) =&gt; ({ '&amp;':'&amp;amp;', '&lt;':'&amp;lt;', '&gt;':'&amp;gt;', '&quot;':'&amp;quot;', &quot;'&quot;:'&amp;#39;' }[c]));

      function tickValues() {
        const count = Math.round((state.max - state.min) / state.step);
        const values = [];
        for (let i = 0; i &lt;= count; i++) values.push(Math.round((state.min + i * state.step) * 100) / 100);
        return values;
      }

      function render(skipTypeset = false) {
        const values = tickValues();
        const zeroInRange = state.min &lt;= 0 &amp;&amp; state.max &gt;= 0;
        const zeroX = zeroInRange ? xFor(0) : null;
        const aX = xFor(state.a);
        const bX = xFor(state.b);
        const maxTicks = values.length &gt; 31;
        const tickEvery = maxTicks ? Math.ceil(values.length / 21) : 1;
        const tickMarkup = values.map((value, index) =&gt; {
          const x = xFor(value);
          const showLabel = index % tickEvery === 0 || index === values.length - 1;
          const isZero = Math.abs(value) &lt; 1e-8;
          return `&lt;g class=&quot;tick-group&quot;&gt;&lt;line x1=&quot;${x}&quot; y1=&quot;${geom.axisY - (isZero ? 21 : 12)}&quot; x2=&quot;${x}&quot; y2=&quot;${geom.axisY + (isZero ? 21 : 12)}&quot; stroke=&quot;${isZero ? '#F9C74F' : 'rgba(203,213,225,.68)'}&quot; stroke-width=&quot;${isZero ? 3 : 2}&quot; /&gt;${showLabel ? `&lt;text class=&quot;svg-label&quot; x=&quot;${x}&quot; y=&quot;${geom.axisY + 47}&quot; fill=&quot;${isZero ? '#F9C74F' : '#A9B7C8'}&quot; font-size=&quot;${isZero ? 21 : 16}&quot; font-weight=&quot;${isZero ? 900 : 600}&quot; text-anchor=&quot;middle&quot;&gt;${esc(signed(value))}&lt;/text&gt;` : ''}&lt;/g&gt;`;
        }).join('');
        const divider = zeroInRange ? `&lt;line x1=&quot;${zeroX}&quot; y1=&quot;${geom.topY + 28}&quot; x2=&quot;${zeroX}&quot; y2=&quot;${geom.bottomY - 17}&quot; stroke=&quot;#F9C74F&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;8 8&quot; opacity=&quot;.78&quot;/&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${zeroX}&quot; y=&quot;${geom.topY + 11}&quot; fill=&quot;#F9C74F&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; text-anchor=&quot;middle&quot;&gt;正负数分界&lt;/text&gt;` : '';
        const regionLabels = zeroInRange ? `&lt;text class=&quot;svg-label&quot; x=&quot;${(geom.left + zeroX) / 2}&quot; y=&quot;${geom.topY + 42}&quot; fill=&quot;#FF8795&quot; font-size=&quot;17&quot; font-weight=&quot;800&quot; text-anchor=&quot;middle&quot;&gt;负数区&lt;/text&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${(zeroX + geom.right) / 2}&quot; y=&quot;${geom.topY + 42}&quot; fill=&quot;#61D6A7&quot; font-size=&quot;17&quot; font-weight=&quot;800&quot; text-anchor=&quot;middle&quot;&gt;正数区&lt;/text&gt;` : '';
        const point = (x, value, label, color, y, key) =&gt; `&lt;g class=&quot;point-group&quot; data-point=&quot;${key}&quot; tabindex=&quot;0&quot; role=&quot;slider&quot; aria-label=&quot;动点 ${label}，当前值 ${esc(signed(value))}&quot; aria-valuemin=&quot;${state.min}&quot; aria-valuemax=&quot;${state.max}&quot; aria-valuenow=&quot;${value}&quot;&gt;&lt;line x1=&quot;${x}&quot; y1=&quot;${geom.axisY}&quot; x2=&quot;${x}&quot; y2=&quot;${y + 19}&quot; stroke=&quot;${color}&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;6 6&quot; opacity=&quot;.8&quot;/&gt;&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;25&quot; fill=&quot;${color}&quot; opacity=&quot;.16&quot;/&gt;&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;16&quot; fill=&quot;${color}&quot; stroke=&quot;#F8FAFC&quot; stroke-width=&quot;4&quot;/&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${x}&quot; y=&quot;${y - 34}&quot; fill=&quot;${color}&quot; font-size=&quot;20&quot; font-weight=&quot;900&quot; text-anchor=&quot;middle&quot;&gt;${label}&lt;/text&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${x}&quot; y=&quot;${y + 7}&quot; fill=&quot;#0B1220&quot; font-size=&quot;15&quot; font-weight=&quot;900&quot; text-anchor=&quot;middle&quot;&gt;${esc(signed(value))}&lt;/text&gt;&lt;/g&gt;`;

        svg.innerHTML = `&lt;defs&gt;&lt;filter id=&quot;glowBlue&quot; x=&quot;-60%&quot; y=&quot;-60%&quot; width=&quot;220%&quot; height=&quot;220%&quot;&gt;&lt;feGaussianBlur stdDeviation=&quot;5&quot; result=&quot;blur&quot;/&gt;&lt;feMerge&gt;&lt;feMergeNode in=&quot;blur&quot;/&gt;&lt;feMergeNode in=&quot;SourceGraphic&quot;/&gt;&lt;/feMerge&gt;&lt;/filter&gt;&lt;filter id=&quot;glowGold&quot; x=&quot;-60%&quot; y=&quot;-60%&quot; width=&quot;220%&quot; height=&quot;220%&quot;&gt;&lt;feGaussianBlur stdDeviation=&quot;6&quot; result=&quot;blur&quot;/&gt;&lt;feMerge&gt;&lt;feMergeNode in=&quot;blur&quot;/&gt;&lt;feMergeNode in=&quot;SourceGraphic&quot;/&gt;&lt;/feMerge&gt;&lt;/filter&gt;&lt;/defs&gt;&lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;1000&quot; height=&quot;360&quot; rx=&quot;16&quot; fill=&quot;transparent&quot;/&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${geom.left}&quot; y=&quot;${geom.bottomY + 42}&quot; fill=&quot;#A9B7C8&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; text-anchor=&quot;start&quot;&gt;向左：越来越小&lt;/text&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${geom.right}&quot; y=&quot;${geom.bottomY + 42}&quot; fill=&quot;#A9B7C8&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot; text-anchor=&quot;end&quot;&gt;向右：越来越大&lt;/text&gt;${regionLabels}${divider}&lt;line x1=&quot;${geom.left}&quot; y1=&quot;${geom.axisY}&quot; x2=&quot;${geom.right + 18}&quot; y2=&quot;${geom.axisY}&quot; stroke=&quot;#67B7FF&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;path d=&quot;M ${geom.right + 18} ${geom.axisY} l -16 -10 M ${geom.right + 18} ${geom.axisY} l -16 10&quot; stroke=&quot;#67B7FF&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot; fill=&quot;none&quot;/&gt;${tickMarkup}${zeroInRange ? `&lt;circle cx=&quot;${zeroX}&quot; cy=&quot;${geom.axisY}&quot; r=&quot;12&quot; fill=&quot;#F9C74F&quot; stroke=&quot;#FFF3B4&quot; stroke-width=&quot;4&quot; filter=&quot;url(#glowGold)&quot;/&gt;&lt;text class=&quot;svg-label&quot; x=&quot;${zeroX}&quot; y=&quot;${geom.axisY - 40}&quot; fill=&quot;#F9C74F&quot; font-size=&quot;16&quot; font-weight=&quot;900&quot; text-anchor=&quot;middle&quot;&gt;原点 O&lt;/text&gt;` : ''}${point(aX, state.a, 'A', '#67B7FF', 119, 'a')}${point(bX, state.b, 'B', '#FF8795', 275, 'b')}`;
        bindPointEvents();
        updateReadout(skipTypeset);
      }

      function bindPointEvents() {
        svg.querySelectorAll('.point-group').forEach((el) =&gt; {
          const key = el.dataset.point;
          el.addEventListener('pointerdown', (event) =&gt; {
            event.preventDefault();
            state.dragging = key;
            svg.setPointerCapture?.(event.pointerId);
            window.__interactionState.dragging = key;
            el.style.cursor = 'grabbing';
          });
          el.addEventListener('keydown', (event) =&gt; {
            if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
            event.preventDefault();
            const dir = event.key === 'ArrowRight' ? 1 : -1;
            state[key] = clamp(state[key] + dir * state.step, state.min, state.max);
            render();
            svg.querySelector(`[data-point=&quot;${key}&quot;]`)?.focus();
          });
        });
        if (svg.dataset.eventsBound === 'true') return;
        svg.dataset.eventsBound = 'true';
        svg.addEventListener('pointermove', (event) =&gt; {
          if (!state.dragging) return;
          const point = new DOMPoint(event.clientX, event.clientY);
          const matrix = svg.getScreenCTM();
          if (!matrix) return;
          const svgPoint = point.matrixTransform(matrix.inverse());
          pendingDragKey = state.dragging;
          pendingDragValue = valueForX(svgPoint.x);
          if (dragFrame) return;
          dragFrame = requestAnimationFrame(() =&gt; {
            dragFrame = 0;
            if (!pendingDragKey || pendingDragValue === null) return;
            state[pendingDragKey] = pendingDragValue;
            if (pendingDragKey === 'a') syncOpposite();
            pendingDragKey = null;
            pendingDragValue = null;
            render(true);
          });
        });
        const stopDragging = () =&gt; {
          if (dragFrame) {
            cancelAnimationFrame(dragFrame);
            dragFrame = 0;
          }
          if (pendingDragKey &amp;&amp; pendingDragValue !== null) {
            state[pendingDragKey] = pendingDragValue;
            if (pendingDragKey === 'a') syncOpposite();
            pendingDragKey = null;
            pendingDragValue = null;
          }
          state.dragging = null;
          window.__interactionState.dragging = null;
          render(false);
        };
        svg.addEventListener('pointerup', stopDragging);
        svg.addEventListener('pointercancel', stopDragging);
      }

      function updateReadout(skipTypeset = false) {
        aValue.textContent = signed(state.a);
        bValue.textContent = signed(state.b);
        rangeSummary.textContent = `当前范围：${signed(state.min)} 到 ${signed(state.max)}，步长 ${signed(state.step)}`;
        let formula;
        let spoken;
        if (state.a &lt; state.b) { formula = `\\(A = ${fmt(state.a)} \\; &lt; \\; B = ${fmt(state.b)}\\)`; spoken = `动点 A 在动点 B 的左边，所以 ${signed(state.a)} 小于 ${signed(state.b)}。`; }
        else if (state.a &gt; state.b) { formula = `\\(A = ${fmt(state.a)} \\; &gt; \\; B = ${fmt(state.b)}\\)`; spoken = `动点 A 在动点 B 的右边，所以 ${signed(state.a)} 大于 ${signed(state.b)}。`; }
        else { formula = `\\(A = B = ${fmt(state.a)}\\)`; spoken = `两个动点重合，它们表示的数相等。`; }
        compareResult.innerHTML = `&lt;div class=&quot;formula-line&quot;&gt;${formula}&lt;/div&gt;&lt;div class=&quot;spoken-line&quot; style=&quot;font-size:.72em;color:#A9B7C8;margin-top:5px&quot;&gt;${spoken}&lt;/div&gt;`;
        window.__interactionState = { ...window.__interactionState, min: state.min, max: state.max, step: state.step, a: state.a, b: state.b, comparison: spoken };
        if (!skipTypeset) typesetMath(compareResult);
      }

      function typesetMath(root) {
        const token = (typesetTokens.get(root) || 0) + 1;
        typesetTokens.set(root, token);
        const waitForMathJax = () =&gt; new Promise((resolve, reject) =&gt; {
          const started = Date.now();
          const check = () =&gt; {
            if (window.MathJax?.startup?.promise) return resolve(window.MathJax);
            if (Date.now() - started &gt; 10000) return reject(new Error('MathJax 加载超时'));
            window.setTimeout(check, 40);
          };
          check();
        });
        waitForMathJax().then((mathJax) =&gt; mathJax.startup.promise.then(() =&gt; {
          if (typesetTokens.get(root) !== token || !root || !root.textContent.trim()) return;
          mathJax.typesetClear([root]);
          return mathJax.typesetPromise([root]);
        })).then(() =&gt; {
          if (typesetTokens.get(root) === token) root.querySelector('.formula-line')?.classList.add('ready');
        }).catch(() =&gt; {
          root.dataset.mathError = 'true';
        });
      }

      function applyRange() {
        const min = Number(minInput.value), max = Number(maxInput.value), step = Number(stepInput.value);
        if (!isValidNumber(min) || !isValidNumber(max) || !isValidNumber(step) || step &lt;= 0 || max &lt;= min) {
          rangeMessage.textContent = '请输入有效范围：最大值要大于最小值，步长需为正数。';
          return;
        }
        if ((max - min) / step &gt; 60) {
